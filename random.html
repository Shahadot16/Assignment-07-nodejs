<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Prompt App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background: #f4f7fb;
      color: #1f2937;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
    }

    textarea {
      width: 100%;
      min-height: 140px;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
      margin-bottom: 12px;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    #resultBox {
      margin-top: 18px;
      padding: 16px;
      background: #eff6ff;
      border-radius: 8px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>AI Prompt Web Application</h1>
    <form id="promptForm">
      <div id="resultBox">__RESULT__</div>
      <textarea id="prompt" name="prompt" placeholder="Write your prompt here..."></textarea>
      <button id="generateBtn" type="submit">Generate Answer</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('promptForm');
    const resultBox = document.getElementById('resultBox');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const prompt = document.getElementById('prompt').value.trim();
      if (!prompt) {
        resultBox.textContent = 'Please enter a prompt first.';
        return;
      }

      resultBox.textContent = 'Generating response...';

      try {
        const response = await fetch('/ai', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ prompt })
        });

        const data = await response.json();
        document.getElementById('prompt').value = ''; // Clear the textarea after submission
        if (!response.ok) {
          throw new Error(data.error || 'Unable to generate a response.');
        }

        resultBox.textContent = data.result || 'No result returned.';
      } catch (error) {
        resultBox.textContent = `Error: ${error.message}`;
      }
    });
  </script>
</body>

</html>
